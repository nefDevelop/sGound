services:
  sgound:
    build: .
    container_name: sgound
    restart: unless-stopped
    ports:
      - "${SGOUND_PORT_HOST:-8088}:8088"
    environment:
      - SGOUND_PORT=8088
      - SGOUND_MUSIC_PATH=/music
      - SGOUND_DB_PATH=/app/data/sgound.db
      - SGOUND_USERS=${SGOUND_USERS:-user:rw}
      # Uncomment and change to customize theme (default: #ff3366)
      # - SGOUND_THEME_COLOR=#ff3366
      - GOMEMLIMIT=180MiB
      - GODEBUG=madvdontneed=1
    volumes:
      - ./data:/app/data:z
      - ${SGOUND_MUSIC_PATH_HOST:-/media/clare/sGound}:/music:rw,z
    deploy:
      resources:
        limits:
          memory: 256M
#          cpus: '0.50'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/api/auth/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

