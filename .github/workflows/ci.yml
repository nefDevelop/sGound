name: Sgound CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Build Frontend
      run: |
        cd web
        npm ci
        npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache: true

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v -ldflags="-w -s" -o sgound ./cmd/sgound/main.go

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: sgound-binary
        path: sgound
